<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprendi+ | Pagina nao encontrada</title>
  <link rel="manifest" href="/Projeto-AprendiMais/manifest.json">
  <meta name="theme-color" content="#7463e3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aprendi+">
  <link rel="apple-touch-icon" href="/Projeto-AprendiMais/images/logo-192.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <!-- CSS por que n deu pra colocar em outro arquivo-->
  <style>
    :root {
      --cor-principal: #6a5af9;
      --cor-secundaria: #8e7dff;
      --cor-fundo: #f5f6fa;
      --cor-titulo: #0d1637;
      --cor-paragrafo: #8b8d93;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f4f6ff 0%, #ece9ff 50%, #f8f8ff 100%);
      background-size: 200% 200%;
      animation: fundoMovendo 10s ease-in-out infinite;
      overflow: hidden;
    }

    @keyframes fundoMovendo {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes flutuar {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .numero-erro {
      animation: flutuar 3.4s ease-in-out infinite;
      text-shadow: 0 10px 35px rgba(106, 90, 249, 0.35);
    }

    .entrada {
      animation: aparecer 0.7s ease-out both;
    }

    .orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(4px);
      opacity: 0.24;
      pointer-events: none;
    }
  </style>

</head>
<body class="relative flex items-center justify-center p-6">
  <div class="orb h-56 w-56 bg-violet-400 top-[-3rem] left-[-3rem] animate-pulse"></div>
  <div class="orb h-72 w-72 bg-indigo-400 bottom-[-5rem] right-[-5rem] animate-pulse"></div>

  <main class="w-full max-w-3xl text-center">
    <p class="entrada text-3xl md:text-5xl font-black tracking-tight" style="color: var(--cor-titulo);">Aprendi+</p>

    <h1 class="numero-erro mt-6 text-8xl md:text-[10rem] leading-none font-black" style="color: var(--cor-principal);">403</h1>

    <h2 class="entrada mt-4 text-2xl md:text-4xl font-bold" style="color: var(--cor-titulo); animation-delay: 0.1s;">
      Esta página não existe
    </h2>

    <p class="entrada mt-3 text-base md:text-lg" style="color: var(--cor-paragrafo); animation-delay: 0.2s;">
      A rota que voce tentou acessar nao foi encontrada. Você não tem permissão para acessar esta página.
      <span id="contador" class="font-semibold" style="color: var(--cor-principal);">8</span>s.
    </p>

    <div class="entrada mt-8 flex flex-col sm:flex-row items-center justify-center gap-3" style="animation-delay: 0.3s;">
      <a href="/Projeto-AprendiMais/index.html" class="inline-flex items-center justify-center rounded-xl px-6 py-3 font-semibold text-white shadow-lg shadow-indigo-300/50 transition-transform duration-300 hover:scale-105" style="background-color: var(--cor-principal);">
        Voltar para o inicio
      </a>
      <button id="voltar" class="inline-flex items-center justify-center rounded-xl px-6 py-3 font-semibold border transition-colors duration-300 hover:bg-white" style="color: var(--cor-principal); border-color: #c9c3ff;">
        Voltar pagina anterior
      </button>
    </div>
  </main>

  <script>
    let restante = 8;
    const contador = document.getElementById('contador');

    const intervalo = setInterval(() => {
      restante -= 1;
      contador.textContent = String(restante);

      if (restante <= 0) {
        clearInterval(intervalo);
        window.location.href = '/Projeto-AprendiMais/index.html';
      }
    }, 1000);

    document.getElementById('voltar').addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '/Projeto-AprendiMais/index.html';
      }
    });
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/Projeto-AprendiMais/sw.js");
    }
  </script>
</body>
</html>
