<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aprendi+ | Login</title>
    <link rel="stylesheet" href="/Projeto-AprendiMais/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css">
    <link rel="shortcut icon" href="/Projeto-AprendiMais/images/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/Projeto-AprendiMais/manifest.json">
    <meta name="theme-color" content="#7463e3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Aprendi+">
    <link rel="apple-touch-icon" href="/Projeto-AprendiMais/images/logo-192.png">

    <style>
      /* ── Fix: tela cheia sem scroll no mobile ── */
      html, body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        align-items: stretch;
        justify-content: center;
        background: var(--cor-fundo, #f4f4f8);
      }

      main {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #main {
        width: 100%;
        height: 100%;
        max-width: 420px;
        border-radius: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* Em telas maiores (desktop/tablet), volta a ter card centralizado */
      @media (min-width: 480px) {
        html, body { overflow: auto; }

        body { padding: 24px 0; }

        #main {
          height: auto;
          min-height: 0;
          border-radius: 30px;
          box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
          margin: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <form method="post" id="main">
        <!-- LOGO -->
        <img src="/Projeto-AprendiMais/images/logo.png" alt="Logo do site" id="logo">
        <!-- TEXTO -->
        <h3 class="text-center mt-2">Bem-vindo!</h3>
        <p class="text-center">Faça login para continuar</p>
        <!-- EMAIL -->
        <label for="email">E-mail</label>
        <input type="email" name="email" id="email" placeholder="seu.email@exemplo.com" required>
        <!-- SENHA -->
        <label for="password">Senha</label>
        <div style="position: relative;">
          <input type="password" name="password" id="password" placeholder="Digite sua senha" required>
          <!-- OLHO -->
          <i class="fas fa-eye" id="togglePassword"
            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888;">
          </i>
        </div>
        <!-- LINKS -->
        <a href="/Projeto-AprendiMais/register/forgotPassword.html">Esqueci minha senha</a>
        <!-- BOTÃO LOGIN -->
        <button type="submit" id="Entrar">Entrar</button>
        <!-- DIVISOR -->
        <div style="display: flex; align-items: center; text-align: center;">
          <div style="flex: 1; border-bottom: 1px solid #8b8d93;"></div>
          <span style="padding: 0 10px; font-size: 1em; color: #8b8d93;">ou</span>
          <div style="flex: 1; border-bottom: 1px solid #8b8d93;"></div>
        </div>
        <!-- BOTÃO CRIAR CONTA -->
        <div class="d-grid mt-2 mx-auto" style="max-width: 300px; width: 100%;">
          <a href="/Projeto-AprendiMais/register/register1.html"><button type="button" id="CriarConta">Criar conta</button></a>
        </div>
      </form>
    </main>
    <!-- SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/Projeto-AprendiMais/scripts/Database.js"></script>
    <script src="/Projeto-AprendiMais/scripts/PaginaInicial.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/Projeto-AprendiMais/sw.js");
      }
    </script>
  </body>
</html>
