<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aprendi+ | Conta criada!</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/Projeto-AprendiMais/css/style.css" />
    <link rel="shortcut icon" href="/Projeto-AprendiMais/images/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/Projeto-AprendiMais/manifest.json">
    <meta name="theme-color" content="#7463e3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Aprendi+">
    <link rel="apple-touch-icon" href="/Projeto-AprendiMais/images/logo-192.png">
    <style>
      /* Canvas de confete por cima de tudo */
      #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
      }
      /* Animação de entrada do card */
      @keyframes popIn {
      0%   { opacity: 0; transform: scale(0.85) translateY(30px); }
      70%  { transform: scale(1.03) translateY(-4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      #main {
      animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      /* Ícone de check animado */
      @keyframes checkPop {
      0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
      60%  { transform: scale(1.15) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      #check-icon {
      animation: checkPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s both;
      }
      /* Texto aparece com fade */
      @keyframes fadeUp {
      0%   { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
      }
      .fade-up-1 { animation: fadeUp 0.5s ease 0.7s both; }
      .fade-up-2 { animation: fadeUp 0.5s ease 0.85s both; }
      .fade-up-3 { animation: fadeUp 0.5s ease 1s both; }
      /* Botão entrar */
      #btn-entrar {
      background-color: var(--cor-botoes);
      color: #fff;
      padding: 10px;
      border: 0;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.3s ease;
      }
      #btn-entrar:hover {
      background-color: var(--cor-botoes-hover);
      }
    </style>
  </head>
  <body>
    <!-- Canvas dos confetes -->
    <canvas id="confetti-canvas"></canvas>
    <main>
      <form id="main" class="max-w-[420px] w-full mx-auto flex flex-col gap-5 items-center text-center">
        <!-- LOGO -->
        <img src="/Projeto-AprendiMais/images/logo.png" alt="Logo do site" id="logo">
        <!-- ÍCONE DE CHECK -->
        <div id="check-icon"
          style="width: 80px; height: 80px; border-radius: 50%; background-color: rgba(116,99,227,0.12); display: flex; align-items: center; justify-content: center;">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="18" stroke="var(--cor-botoes)" stroke-width="3"/>
            <path d="M12 20.5L17.5 26L28 14" stroke="var(--cor-botoes)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <!-- TEXTO PRINCIPAL -->
        <div class="fade-up-1" style="display: flex; flex-direction: column; gap: 6px;">
          <h3 style="margin: 0;">Conta criada com sucesso!</h3>
          <p style="color: var(--cor-paragrafo); margin: 0; font-size: 0.95em;">
            Bem-vindo ao <strong style="color: var(--cor-botoes);">Aprendi+</strong>! Sua jornada de aprendizado começa agora.
          </p>
        </div>
        <!-- CARDS DE RESUMO -->
        <div class="fade-up-2" style="width: 100%; background: #f3f3f8; border: 1px solid #ececf2; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(116,99,227,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="var(--cor-botoes)" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </div>
            <div style="text-align: left;">
              <p style="margin: 0; font-size: 0.75em; color: var(--cor-paragrafo);">Perfil criado</p>
              <p style="margin: 0; font-size: 0.9em; font-weight: bold; color: var(--cor-titulo);">Suas preferências foram salvas</p>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(116,99,227,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="var(--cor-botoes)" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
              </svg>
            </div>
            <div style="text-align: left;">
              <p style="margin: 0; font-size: 0.75em; color: var(--cor-paragrafo);">Conteúdo personalizado</p>
              <p style="margin: 0; font-size: 0.9em; font-weight: bold; color: var(--cor-titulo);">Pronto para você explorar</p>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(116,99,227,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="var(--cor-botoes)" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
              </svg>
            </div>
            <div style="text-align: left;">
              <p style="margin: 0; font-size: 0.75em; color: var(--cor-paragrafo);">Progresso</p>
              <p style="margin: 0; font-size: 0.9em; font-weight: bold; color: var(--cor-titulo);">Acompanhe sua evolução</p>
            </div>
          </div>
        </div>
        <!-- BOTÃO ENTRAR -->
        <div class="fade-up-3" style="width: 100%;">
          <button type="button" id="btn-entrar" onclick="entrar()">
          Entrar no Aprendi+
          </button>
        </div>
      </form>
    </main>
    <!-- SCRIPT CONFETE -->
    <script src="/Projeto-AprendiMais/scripts/Database.js"></script>
    <script src="/Projeto-AprendiMais/scripts/login-ContaCriada.js"></script>
    <script>
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
      
      const colors = ["#7463e3", "#a78bfa", "#c4b5fd", "#f472b6", "#60a5fa", "#34d399", "#fbbf24", "#fb923c"];
      
      const pieces = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        w: Math.random() * 10 + 6,
        h: Math.random() * 5 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        speed: Math.random() * 3 + 2,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.15,
        drift: (Math.random() - 0.5) * 1.5,
        opacity: Math.random() * 0.5 + 0.5,
      }));
      
      let frame = 0;
      const maxFrames = 220;
      
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      
        pieces.forEach((p) => {
          ctx.save();
          ctx.globalAlpha = p.opacity * Math.max(0, 1 - frame / maxFrames);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
      
          p.y += p.speed;
          p.x += p.drift;
          p.angle += p.spin;
        });
      
        frame++;
        if (frame < maxFrames) {
          requestAnimationFrame(draw);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      
      // Dispara após a animação do card aparecer
      setTimeout(draw, 500);
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/Projeto-AprendiMais/sw.js");
      }
    </script>
  </body>
</html>
